<!DOCTYPE html>
<html>
  <body style="margin:0;padding:24px;background:#f7f9fb;font-family:Inter,system-ui,sans-serif;color:#0f2137;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #dbe4ea;border-radius:12px;padding:32px;">
      <tr>
        <td>
          <p style="margin:0 0 16px;font-size:16px;line-height:1.5;">Hi,</p>
          <p style="margin:0 0 16px;font-size:16px;line-height:1.5;">
            Confirm your email to finish creating your Radio From Scratch account.
          </p>
          <p style="margin:24px 0;">
            <a
              href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
              style="display:inline-block;padding:12px 20px;background:#0d6a86;color:#ffffff;text-decoration:none;border-radius:8px;font-weight:600;"
            >
              Confirm your email
            </a>
          </p>
          <p style="margin:0 0 24px;font-size:14px;line-height:1.5;color:#5a6b7b;">
            If you did not create this account, you can ignore this email.
          </p>
          <div style="padding-top:24px;border-top:1px solid #dbe4ea;text-align:center;">
            <img
              src="{{ .SiteURL }}/RFS.jpeg"
              alt="Radio From Scratch"
              width="180"
              style="display:block;margin:0 auto;max-width:180px;height:auto;"
            />
          </div>
        </td>
      </tr>
    </table>
  </body>
</html>
